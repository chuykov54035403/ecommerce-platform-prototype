services:
  cassandra:
    image: cassandra:5
    container_name: ecommerce-platform-prototype-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: ecommerce-mvp
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - ecommerce-platform-prototype-cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 30

volumes:
  ecommerce-platform-prototype-cassandra-data:
