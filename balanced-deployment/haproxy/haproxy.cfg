global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend main_http
    bind *:80

    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

    acl is_catalog path_beg /catalog
    acl is_order path_beg /order
    acl is_inventory path_beg /inventory
    acl is_assembly path_beg /assembly
    acl is_dashboard path_beg /dashboard

    use_backend catalog_service if is_catalog
    use_backend order_service if is_order
    use_backend inventory_service if is_inventory
    use_backend assembly_service if is_assembly
    use_backend monitoring_dashboard if is_dashboard
    default_backend not_found

backend catalog_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path ^/catalog/?(.*)$ /\1
    server srv-catalog01 10.10.1.221:8000 check
    server srv-catalog02 10.10.1.214:8000 check

backend order_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path ^/order/?(.*)$ /\1
    server srv-order01 10.10.1.228:8000 check
    server srv-order02 10.10.1.229:8000 check

backend inventory_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path ^/inventory/?(.*)$ /\1
    server srv-inventory01 10.10.1.226:8000 check
    server srv-inventory02 10.10.1.227:8000 check

backend assembly_service
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path ^/assembly/?(.*)$ /\1
    server srv-assembly01 10.10.1.223:8000 check
    server srv-assembly02 10.10.1.225:8000 check

backend monitoring_dashboard
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path ^/dashboard/?(.*)$ /\1
    server monitoring-dashboard monitoring-dashboard:8000 check

backend not_found
    http-request return status 404 content-type text/plain string "unknown service prefix"
