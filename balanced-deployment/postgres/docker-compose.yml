services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-platform-prototype-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-platform-prototype-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ecommerce-platform-prototype-postgres-data:
